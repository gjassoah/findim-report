name = "findimCounterexample"
version = "0.1.0"
defaultTargets = ["FindimCounterexample"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "FindimCounterexample"
globs = ["FindimCounterexample", "FindimCounterexample.*"]
leanOptions = { autoImplicit = false, warningAsError = true, weak.linter.mathlibStandardSet = true }

[[lean_exe]]
name = "audit_axioms"
root = "Audit.Axioms"
